<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="color-scheme" content="only light"><title>Portal das Filiais</title>
<style>
:root{
  color-scheme:light;
  --brand-navy:#0B2E59;--brand-navy-2:#003876;--brand-blue:#1F5FA8;--brand-sky:#8FC1F0;
  --paper:#F6F4EE;--surface:#FFFFFF;--surface-2:#FBFAF6;--ink:#211F1B;--ink-soft:#6E6858;--ink-faint:#8A836F;
  --line:#E3DDCD;--accent:#1F5FA8;--accent-soft:#E1EAF5;--btn-bg:#EEF4FB;--btn-line:#C9DAEE;--btn-ink:#1F5FA8;
  --danger:#A6402F;--danger-soft:#F3DAD4;--good:#3E7A56;--good-soft:#DCEBE1;
  --shadow:0 1px 2px rgba(33,31,27,.06),0 4px 14px rgba(33,31,27,.05);--radius:10px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-inline:20px;line-height:1.45}
#page{max-width:1180px;margin:0 auto;padding-bottom:48px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.topbar{margin-top:20px;padding:20px 22px 0;border-radius:var(--radius);background:linear-gradient(135deg,var(--brand-navy),var(--brand-navy-2));box-shadow:var(--shadow);color:#fff}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:34px;width:auto;display:block;flex:none}
.brand .sep{width:1px;height:34px;background:rgba(255,255,255,.28)}
.brand h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.brand .sub{font-size:.82rem;color:#C6D3E3;margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative}
.search input{width:260px;max-width:70vw;padding:9px 12px 9px 34px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff}
.search input::placeholder{color:#C6D3E3}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.8}
.filial-sel{padding:9px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff}
.filial-sel option{color:#211F1B}
.btn-new{font-weight:600;font-size:.9rem;border:none;border-radius:999px;padding:10px 18px;cursor:pointer;background:#fff;color:var(--brand-navy);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-new:hover{background:#E4F0FC}
.tabs{display:flex;gap:4px;margin-top:18px;overflow-x:auto}
.tab{background:transparent;border:none;color:#C6D3E3;padding:11px 16px 12px;font-weight:600;font-size:.93rem;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:#fff}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--brand-sky)}
.tab .n{font-variant-numeric:tabular-nums;font-size:.75rem;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 8px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brand-sky);outline-offset:2px}
.intro{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:22px 2px 14px}
.intro h2{margin:0;font-size:1.15rem}
.intro p{margin:2px 0 0;color:var(--ink-soft);font-size:.9rem;max-width:640px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--btn-line);background:var(--surface);color:var(--btn-ink);border-radius:999px;padding:5px 12px;font-size:.82rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand-navy);border-color:var(--brand-navy);color:#fff}
/* docs */
.doc-group{margin-bottom:22px}
.doc-group h3{font-size:.9rem;color:var(--ink-soft);margin:0 0 8px 2px;font-weight:600}
.doc-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.doc{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:13px 16px;border-top:1px solid var(--line)}
.doc:first-child{border-top:none}
.doc .ico{width:40px;height:40px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.doc .t{font-weight:600;margin:0}
.doc .t a{color:var(--ink);text-decoration:none}
.doc .t a:hover{color:var(--accent);text-decoration:underline}
.doc .d{margin:2px 0 0;font-size:.85rem;color:var(--ink-soft)}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:5px;font-size:.76rem;color:var(--ink-faint)}
.tag{font-size:.72rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 7px}
.row-actions{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.icon-btn{border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--btn-ink);border-radius:7px;height:30px;min-width:30px;padding:0 9px;cursor:pointer;font-size:.8rem;display:inline-flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.icon-btn.open{background:var(--brand-navy);border-color:var(--brand-navy);color:#fff}
.icon-btn.open:hover{background:var(--brand-blue);color:#fff}
/* canais */
.chan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.chan{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px;border-left:4px solid var(--brand-blue)}
.chan.t-urgente{border-left-color:var(--danger)}
.chan-head{display:flex;gap:10px;align-items:center}
.chan-head .ico{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);flex:none}
.chan h4{margin:0;font-size:1rem}
.chan .kind{font-size:.76rem;color:var(--ink-faint)}
.chan .when{font-size:.86rem;color:var(--ink-soft);margin:0}
.chan .addr{font-size:.86rem;font-weight:600;word-break:break-word;background:var(--surface);border:1px dashed var(--btn-line);border-radius:7px;padding:7px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.chan .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
/* contatos */
.ct-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.ct{display:grid;grid-template-columns:44px minmax(160px,1.3fr) minmax(120px,1fr) minmax(170px,1.2fr) 124px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.ct:first-child{border-top:none}
.ct.head{background:var(--surface-2);font-size:.76rem;font-weight:600;color:var(--ink-faint);padding-block:9px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--brand-navy);color:#fff;font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.ct .nm{font-weight:600}
.ct .rl{font-size:.83rem;color:var(--ink-soft)}
.ct .fl{font-size:.85rem}
.ct .fl small{display:block;color:var(--ink-faint);font-size:.76rem}
.ct .cx{font-size:.84rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.ct .cx a{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct .cx a:hover{text-decoration:underline}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:34px 20px;text-align:center;color:var(--ink-soft)}
.empty h3{margin:0 0 4px;color:var(--ink);font-size:1rem}
.empty p{margin:0 0 14px;font-size:.9rem}
.empty .btn-new{margin:0 auto;background:var(--brand-navy);color:#fff}
.empty .btn-new:hover{background:var(--brand-blue)}
.readonly-note{font-size:.8rem;color:var(--ink-faint);margin:4px 2px 0}
/* modal */
.backdrop{position:fixed;inset:0;background:rgba(20,18,14,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;z-index:20;overflow-y:auto}
.backdrop[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,.25);width:100%;max-width:480px;padding:20px}
.modal h2{margin:0 0 14px;font-size:1.1rem}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:.82rem;font-weight:600;color:var(--ink-soft)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:9px 11px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.m-actions .r{display:flex;gap:8px;margin-left:auto}
.btn{border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--btn-ink);border-radius:999px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:.88rem}
.btn.primary{background:var(--brand-navy);border-color:var(--brand-navy);color:#fff}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent;padding-inline:4px}
.btn.danger.confirm{background:var(--danger);color:#fff;padding-inline:14px}
.err{color:var(--danger);font-size:.8rem;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand-navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:.88rem;box-shadow:var(--shadow);z-index:30}
.toast[hidden]{display:none}
.status{font-size:.76rem;color:#C6D3E3;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#8FB3DC}
.dot.on{background:#7FD19B}
.dot.warn{background:#FFB27A}
.btn-ghost{font-weight:600;font-size:.88rem;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:9px 15px;cursor:pointer;background:rgba(255,255,255,.08);color:#fff;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.18)}
.btn-ghost:disabled{opacity:.5;cursor:default}
.btn-ghost.save:not(:disabled){background:var(--brand-sky);border-color:var(--brand-sky);color:var(--brand-navy)}
.btn-ghost .n{background:var(--brand-navy);color:#fff;border-radius:999px;font-size:.72rem;padding:1px 7px}
@media (max-width:760px){
  body{padding-inline:12px}
  .search input{width:100%}
  .search{flex:1 1 100%}
  .ct{grid-template-columns:40px 1fr auto;row-gap:4px}
  .ct.head{display:none}
  .ct .fl,.ct .cx{grid-column:2 / 3}
  .ct .row-actions{grid-row:1;grid-column:3}
  .doc{grid-template-columns:36px 1fr}
  .doc .row-actions{grid-column:2}
  .two{grid-template-columns:1fr}
}
html,:root,:root[data-theme]{color-scheme:only light !important;background:#F6F4EE !important}
html body{background:#F6F4EE !important;color:#211F1B !important}
.field input,.field select,.field textarea{background:#FBFAF6 !important;color:#211F1B !important}
.modal{background:#fff !important;color:#211F1B !important}
/* comunicações */
.com{margin-bottom:16px}
.com-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 10px}
.com-head h3{margin:0;font-size:1.05rem;color:var(--brand-navy);display:flex;align-items:center;gap:10px}
.com-head h3::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--brand-sky)}
.com-empty{padding:26px 20px}
.car{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:var(--brand-navy);aspect-ratio:8/3;min-height:220px}
.car:focus-visible{outline:2px solid var(--brand-sky);outline-offset:3px}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s}
.slide.on{opacity:1;visibility:visible}
.slide img,.slide-ph{width:100%;height:100%;object-fit:cover;display:block}
.slide-ph{background:linear-gradient(135deg,var(--brand-navy),var(--brand-blue))}
.slide-cap{position:absolute;left:0;right:0;bottom:0;padding:48px 64px 34px 28px;background:linear-gradient(to top,rgba(8,24,48,.88),rgba(8,24,48,.55) 55%,transparent);color:#fff}
.slide-cap h4{margin:0 0 4px;font-size:1.35rem;line-height:1.2;max-width:760px}
.slide-cap p{margin:0;font-size:.93rem;color:#DCE6F2;max-width:680px}
.slide-act{display:flex;gap:8px;align-items:center;margin-top:12px}
.slide-btn{background:#fff;color:var(--brand-navy);font-weight:600;font-size:.85rem;border-radius:999px;padding:8px 14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.slide-btn:hover{background:#E4F0FC}
.slide-edit{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.car-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.85);color:var(--brand-navy);font-size:1.5rem;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding-bottom:3px}
.car-nav:hover{background:#fff}
.car-nav.prev{left:12px}.car-nav.next{right:12px}
.dots{position:absolute;right:18px;bottom:14px;display:flex;gap:6px}
.dots button{width:9px;height:9px;border-radius:50%;border:none;padding:0;background:rgba(255,255,255,.5);cursor:pointer}
.dots button[aria-current="true"]{background:#fff;width:22px;border-radius:5px}
.com-prev{width:100%;max-height:150px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
@media (max-width:760px){.car{aspect-ratio:auto;height:300px}.slide-cap{padding:40px 18px 36px}.slide-cap h4{font-size:1.1rem}.car-nav{display:none}.dots{left:18px;right:auto}}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
/* visão geral */
.about{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.about img{width:100%;height:100%;min-height:240px;object-fit:cover;display:block}
.about-txt{padding:22px 26px;display:flex;flex-direction:column;justify-content:center}
.about-txt h3{margin:0 0 10px;font-size:1.15rem;color:var(--brand-navy);display:flex;align-items:center;gap:10px}
.about-txt h3::before{content:"";width:4px;height:20px;border-radius:2px;background:var(--brand-sky)}
.about-txt p{margin:0 0 8px;color:var(--ink-soft);font-size:.92rem}
.about-txt .about-end{margin:4px 0 0;color:var(--brand-navy);font-weight:600}
@media (max-width:760px){.about{grid-template-columns:1fr}.about img{min-height:0;height:auto;aspect-ratio:826/371}.about-txt{padding:18px}}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ov-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--brand-navy)}
.ov-ico{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.ov-card h3{margin:4px 0 0;font-size:1.08rem}
.ov-card p{margin:0;color:var(--ink-soft);font-size:.9rem;flex:1}
.ov-foot{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.ov-count{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.ov-count b{font-size:2rem;line-height:1;color:var(--brand-navy);font-variant-numeric:tabular-nums}
.ov-count span{font-size:.85rem;color:var(--ink-soft);font-weight:600}
.ov-sub{font-size:.78rem;color:var(--ink-faint);margin-top:-4px}
.ov-n b{color:var(--ink);font-size:1rem}
.ov-go{border:none;border-radius:999px;background:var(--brand-navy);color:#fff;font-weight:600;font-size:.85rem;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ov-go:hover{background:var(--brand-blue)}
/* links úteis: link x arquivo */
.ctype{font-weight:600;color:var(--accent)}
.chan.t-file{border-left-color:var(--brand-navy)}
.chan .addr.file small{color:var(--ink-faint);font-weight:500;white-space:nowrap}
.seg{display:flex;gap:8px}
.seg label{flex:1;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;border:1px solid var(--btn-line);background:var(--btn-bg);color:var(--btn-ink);border-radius:8px;padding:9px 10px;font-weight:600;font-size:.9rem}
.seg input:checked+span{background:var(--brand-navy);border-color:var(--brand-navy);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--brand-sky);outline-offset:2px}
.field input[type=file]{padding:7px}
.hint{color:var(--ink-faint);font-size:.76rem}
.file-cur{display:flex;justify-content:space-between;gap:8px;border:1px dashed var(--btn-line);border-radius:7px;padding:8px 10px;font-size:.88rem}
.file-cur small{color:var(--ink-faint)}
.err.info{color:var(--accent)}
[hidden]{display:none !important}
</style><script>(function(){var r=document.documentElement;function f(){if(r.getAttribute("data-theme")!=="light")r.setAttribute("data-theme","light");}f();new MutationObserver(f).observe(r,{attributes:true,attributeFilter:["data-theme","class"]});})();</script></head><body>
<div id="page">
<header class="topbar">

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
function safeUrl(u){u=String(u||"").trim();if(!u)return "";if(/^(https?:|mailto:|tel:)/i.test(u))return u;if(/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u))return "https://"+u;return "";}
function toast(m){var t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true;},2600);}
function initials(n){var p=String(n||"?").trim().split(/\s+/);return ((p[0]||"?")[0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase();}
function fmtDate(iso){if(!iso)return "";var d=new Date(iso+(iso.length===10?"T12:00:00":""));return isNaN(d)?"":d.toLocaleDateString("pt-BR");}
function fmtSize(n){n=Number(n)||0;if(n<1024)return n+" B";if(n<1048576)return (n/1024).toFixed(0)+" KB";return (n/1048576).toFixed(n<10485760?1:0).replace(".",",")+" MB";}

/* ---------- storage (Cloudflare Worker + D1) ---------- */
var pending={};           // chave "col|id" -> {col,id,op:'set'|'delete',data,isNew}
var lastSync=null, syncing=false, saving=false, online=false;
function pendCount(){return Object.keys(pending).length;}
function applySnapshot(s){COLS.forEach(function(c){state[c]=s&&Array.isArray(s[c])?s[c]:[];});}
function cacheSave(){try{var o={savedAt:lastSync};COLS.forEach(function(c){o[c]=state[c];});localStorage.setItem(LS,JSON.stringify(o));}catch(e){}}
function cacheLoad(){try{var o=JSON.parse(localStorage.getItem(LS)||"null");if(o){applySnapshot(o);lastSync=o.savedAt||null;}}catch(e){}}
function setStatus(){
  var n=pendCount(),t;
  if(syncing)t="Sincronizando…";else if(saving)t="Salvando…";
  else if(n)t=n+(n>1?" alterações não salvas":" alteração não salva");
  else if(!online)t="Sem conexão com o servidor";
  else if(lastSync)t="Sincronizado em "+new Date(lastSync).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  else t="Compartilhado com a equipe";
  $("dot").className="dot"+(n?" warn":online?" on":"");$("statusTxt").textContent=t;
  $("btnSave").disabled=!n||saving;$("saveN").textContent=n;$("saveN").hidden=!n;
  $("btnSync").disabled=syncing||saving;
}
function newId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():"id"+Date.now().toString(36)+Math.random().toString(36).slice(2,10);}
function upsert(col,id,data){
  var isNewItem=!id;
  var now=new Date().toISOString();data.updatedAt=now;
  if(id){var old=state[col].find(function(x){return x.id===id;})||{};data=Object.assign({createdAt:old.createdAt||now},data);
    state[col]=state[col].map(function(x){return x.id===id?Object.assign({},data,{id:id}):x;});}
  else{id=newId();data.createdAt=now;state[col].push(Object.assign({},data,{id:id}));}
  var k0=col+"|"+id,wasNew=pending[k0]?pending[k0].isNew:isNewItem;pending[k0]={col:col,id:id,op:"set",data:data,isNew:wasNew};
  setStatus();render();return Promise.resolve();
}
function remove(col,id){
  state[col]=state[col].filter(function(x){return x.id!==id;});
  var k=col+"|"+id;
  if(pending[k]&&pending[k].isNew){delete pending[k];}else pending[k]={col:col,id:id,op:"delete"};
  setStatus();render();return Promise.resolve();
}

function apiErr(r){return r.json().catch(function(){return {};}).then(function(j){throw {status:r.status,code:j.error||("HTTP "+r.status)};});}

/* Sincronizar: busca os dados atuais no D1 através do Worker */
function doSync(silent){
  if(pendCount()&&!confirm("Você tem "+pendCount()+" alteração(ões) não salvas. Sincronizar vai descartá-las. Continuar?"))return;
  syncing=true;setStatus();
  fetch(API_BASE+"/api/data",{cache:"no-store"})
  .then(function(r){if(!r.ok)return apiErr(r);return r.json();})
  .then(function(d){applySnapshot(d);pending={};online=true;lastSync=d.savedAt||new Date().toISOString();cacheSave();if(!silent)toast("Portal sincronizado.");})
  .catch(function(e){console.error("portal-filiais: sync",e);online=false;toast(e&&e.code==="db_missing"?"O banco D1 não está ligado ao Worker.":"Não foi possível sincronizar agora.");})
  .then(function(){syncing=false;setStatus();render();});
}

/* Salvar: envia só as alterações pendentes para o Worker gravar no D1 */
function doSave(){
  var ops=Object.keys(pending).map(function(k){var o=pending[k];return {col:o.col,id:o.id,op:o.op,data:o.data};});
  if(!ops.length)return;
  saving=true;setStatus();
  fetch(API_BASE+"/api/save",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({ops:ops})})
  .then(function(r){if(!r.ok)return apiErr(r);return r.json();})
  .then(function(d){applySnapshot(d);pending={};online=true;lastSync=d.savedAt||new Date().toISOString();cacheSave();render();toast("Alterações salvas para toda a equipe.");})
  .catch(function(e){console.error("portal-filiais: save",e);
    toast(e&&e.code==="db_missing"?"O banco D1 não está ligado ao Worker.":"Não foi possível salvar agora. Suas alterações continuam pendentes.");})
  .then(function(){saving=false;setStatus();});
}

/* ---------- filtering ---------- */
function filiais(){var s={};TABS.forEach(function(c){state[c].forEach(function(x){var f=String(x.filial||"").trim();if(f&&norm(f)!=="todas")s[f]=1;});});return Object.keys(s).sort(function(a,b){return a.localeCompare(b,"pt-BR");});}
function matchFilial(x){if(!ui.filial)return true;var f=String(x.filial||"").trim();return !f||norm(f)==="todas"||f===ui.filial;}
function matchQ(x,fields){if(!ui.q)return true;var q=norm(ui.q);return fields.some(function(k){return norm(x[k]).indexOf(q)>=0;});}
var F={docs:["titulo","categoria","descricao","responsavel","filial"],canais:["nome","tipo","endereco","quandoUsar","horario","filial","arquivoNome"],contatos:["nome","cargo","area","filial","telefone","email"]};
var CHIPKEY={docs:"categoria",canais:"tipo",contatos:"area"};
function visible(col,ignoreChip){return state[col].filter(function(x){return matchFilial(x)&&matchQ(x,F[col])&&(ignoreChip||!ui.chip[col]||x[CHIPKEY[col]]===ui.chip[col]);});}

function render(){
  TABS.forEach(function(c){$("n-"+c).textContent=visible(c,true).length;});
  var sel=$("filial"),cur=ui.filial,fs=filiais();
  sel.innerHTML='<option value="">Todas as filiais</option>'+fs.map(function(f){return '<option'+(f===cur?' selected':'')+'>'+esc(f)+'</option>';}).join("");
  if(cur&&fs.indexOf(cur)<0){ui.filial="";}
  document.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-selected",t.dataset.tab===ui.tab?"true":"false");});
  if(ui.tab==="overview"){$("btnAdd").hidden=true;$("main").innerHTML=rOverview();startCarousel();return;}
  clearInterval(carTimer);carTimer=null;
  $("btnAdd").hidden=!canWrite;$("btnAddLbl").textContent=COPY[ui.tab].add;
  var col=ui.tab,items=visible(col),all=visible(col,true),c=COPY[col];
  var opts=col==="docs"?CATS:col==="canais"?TIPOS:[];
  var present={};all.forEach(function(x){if(x[CHIPKEY[col]])present[x[CHIPKEY[col]]]=1;});
  var chipList=(col==="contatos"?Object.keys(present).sort():opts.filter(function(o){return present[o];}).concat(Object.keys(present).filter(function(k){return opts.indexOf(k)<0;})));
  var h='<section class="intro"><div><h2>'+c.h+'</h2><p>'+c.p+'</p>'+(canWrite?'':'<p class="readonly-note">Você está vendo em modo leitura.</p>')+'</div>';
  if(chipList.length>1){h+='<div class="chips"><button class="chip" data-chip="" aria-pressed="'+(!ui.chip[col])+'">Todos</button>'+chipList.map(function(k){return '<button class="chip" data-chip="'+esc(k)+'" aria-pressed="'+(ui.chip[col]===k)+'">'+esc(CHIPLBL[k]||k)+'</button>';}).join("")+'</div>';}
  h+='</section>';
  if(!state[col].length){h+='<div class="empty"><h3>'+c.emptyH+'</h3><p>'+c.emptyP+'</p>'+(canWrite?'<button class="btn-new" data-add="1">'+c.add+'</button>':'')+'</div>';}
  else if(!items.length){h+='<div class="empty"><h3>Nada encontrado</h3><p>Ajuste a busca ou o filtro de filial.</p></div>';}
  else h+=(col==="docs"?rDocs(items):col==="canais"?rCanais(items):rContatos(items));
  $("main").innerHTML=h;
}

var MAX_IMAGE=10*1024*1024, carTimer=null;
function comSorted(){return state.comunicacoes.slice().sort(function(a,b){return String(b.createdAt||"").localeCompare(String(a.createdAt||""));});}
function imgUrl(x){return fileUrl(x)+"?v="+encodeURIComponent(String(x.arquivoChave||"").slice(-12));}
function rCarousel(){
  var list=comSorted();
  var head='<div class="com-head"><h3>Comunicações</h3>'+(canWrite?'<button class="icon-btn" data-edit="comunicacoes|">+ Adicionar comunicação</button>':'')+'</div>';
  if(!list.length)return '<section class="com">'+head+'<div class="empty com-empty"><h3>Nenhuma comunicação publicada</h3><p>Adicione avisos, campanhas e novidades com imagem para aparecerem aqui em destaque.</p></div></section>';
  if(ui.slide>=list.length)ui.slide=0;
  var slides=list.map(function(x,i){
    var u=safeUrl(x.link);
    return '<div class="slide'+(i===ui.slide?' on':'')+'" role="group" aria-roledescription="slide" aria-label="'+(i+1)+' de '+list.length+'"'+(i===ui.slide?'':' aria-hidden="true"')+'>'+
      (x.arquivoChave?'<img src="'+esc(imgUrl(x))+'" alt="'+esc(x.titulo)+'"'+(i===0?'':' loading="lazy"')+'>':'<div class="slide-ph"></div>')+
      '<div class="slide-cap"><h4>'+esc(x.titulo)+'</h4>'+(x.texto?'<p>'+esc(x.texto)+'</p>':'')+
      '<div class="slide-act">'+(u?'<a class="slide-btn" href="'+esc(u)+'" target="_blank" rel="noopener"'+(i===ui.slide?'':' tabindex="-1"')+'>Saiba mais '+I.arrow+'</a>':'')+
      (canWrite?'<button class="slide-edit" data-edit="comunicacoes|'+esc(x.id)+'" aria-label="Editar comunicação"'+(i===ui.slide?'':' tabindex="-1"')+'>'+I.edit+'</button>':'')+'</div></div></div>';
  }).join("");
  var ctrl=list.length>1?'<button class="car-nav prev" data-slide="prev" aria-label="Anterior">‹</button><button class="car-nav next" data-slide="next" aria-label="Próxima">›</button><div class="dots">'+list.map(function(_,i){return '<button data-slide="'+i+'" aria-label="Ir para a comunicação '+(i+1)+'"'+(i===ui.slide?' aria-current="true"':'')+'></button>';}).join("")+'</div>':'';
  return '<section class="com">'+head+'<div class="car" id="car" role="region" aria-roledescription="carrossel" aria-label="Comunicações" tabindex="0">'+slides+ctrl+'</div></section>';
}
function goSlide(n){
  var list=comSorted();if(!list.length)return;
  ui.slide=(n+list.length)%list.length;
  var car=$("car");if(!car)return;
  car.querySelectorAll(".slide").forEach(function(el,i){var on=i===ui.slide;el.classList.toggle("on",on);if(on)el.removeAttribute("aria-hidden");else el.setAttribute("aria-hidden","true");
    el.querySelectorAll("a,button").forEach(function(b){if(on)b.removeAttribute("tabindex");else b.setAttribute("tabindex","-1");});});
  car.querySelectorAll(".dots button").forEach(function(d,i){if(i===ui.slide)d.setAttribute("aria-current","true");else d.removeAttribute("aria-current");});
}
function startCarousel(){
  clearInterval(carTimer);carTimer=null;
  var car=$("car");if(!car||comSorted().length<2)return;
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var paused=false;
  car.onmouseenter=function(){paused=true;};car.onmouseleave=function(){paused=false;};
  car.addEventListener("focusin",function(){paused=true;});car.addEventListener("focusout",function(){paused=false;});
  car.onkeydown=function(e){if(e.key==="ArrowLeft"){goSlide(ui.slide-1);}else if(e.key==="ArrowRight"){goSlide(ui.slide+1);}};
  var x0=null;car.addEventListener("touchstart",function(e){x0=e.touches[0].clientX;paused=true;},{passive:true});
  car.addEventListener("touchend",function(e){if(x0==null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)goSlide(ui.slide+(dx<0?1:-1));x0=null;paused=false;},{passive:true});
  if(!reduce)carTimer=setInterval(function(){if(!paused&&!document.hidden)goSlide(ui.slide+1);},6000);
}

function saveComunicacao(){
  var cur=editing.id?state.comunicacoes.find(function(x){return x.id===editing.id;}):null;
  var titulo=$("f_titulo").value.trim(),texto=$("f_texto").value.trim(),link=$("f_link").value.trim(),file=$("f_imagem").files[0];
  if(!titulo){msg("Preencha o título.",true);return;}
  if(link&&!safeUrl(link)){msg("O link precisa começar com http:// ou https://.",true);return;}
  if(!file&&!(cur&&cur.arquivoChave)){msg("Escolha uma imagem.",true);return;}
  if(file&&!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){msg("Use uma imagem JPG, PNG, WebP ou GIF.",true);return;}
  if(file&&file.size>MAX_IMAGE){msg("A imagem passa de 10 MB.",true);return;}
  if(!file){
    var base=Object.assign({},cur);delete base.id;
    upsert("comunicacoes",editing.id,Object.assign(base,{titulo:titulo,texto:texto,link:link})).then(function(){closeModal();toast("Pronto. Clique em Salvar para gravar.");});
    return;
  }
  var id=editing.id||newId(),b=$("mSave");b.disabled=true;$("mCancel").disabled=true;msg("Enviando imagem…",false);
  uploadFile(id,file,{titulo:titulo,texto:texto,link:link},"comunicacoes").then(function(res){
    var item=res.item;
    state.comunicacoes=state.comunicacoes.filter(function(x){return x.id!==item.id;}).concat([item]);
    delete pending["comunicacoes|"+item.id];if(res.savedAt)lastSync=res.savedAt;
    if(!editing.id)ui.slide=0;
    online=true;cacheSave();closeModal();setStatus();render();toast("Comunicação publicada.");
  }).catch(function(e){console.error("portal-filiais: upload",e);
    msg(e&&e.code==="files_missing"?"O armazenamento de arquivos (R2) ainda não está configurado no Worker.":e&&e.code==="not_image"?"Use uma imagem JPG, PNG, WebP ou GIF.":e&&e.code==="too_large"?"A imagem passa do limite permitido.":"Não foi possível enviar a imagem. Tente de novo.",true);
  }).then(function(){b.disabled=false;$("mCancel").disabled=false;});
}
function editBtn(col,id){return canWrite?'<button class="icon-btn" data-edit="'+col+'|'+esc(id)+'" aria-label="Editar">'+I.edit+'</button>':'';}
function rDocs(items){
  var g={};items.forEach(function(x){var k=x.categoria||"Outros";(g[k]=g[k]||[]).push(x);});
  var order=CATS.filter(function(k){return g[k];}).concat(Object.keys(g).filter(function(k){return CATS.indexOf(k)<0;}));
  return order.map(function(k){
    var list=g[k].sort(function(a,b){return String(a.titulo).localeCompare(String(b.titulo),"pt-BR");});
    return '<div class="doc-group"><h3>'+esc(k)+' · '+list.length+'</h3><div class="doc-list">'+list.map(function(x){
      var u=safeUrl(x.url),m=[];
      if(x.filial&&norm(x.filial)!=="todas")m.push('<span class="tag">'+esc(x.filial)+'</span>');
      if(x.responsavel)m.push('Responsável: '+esc(x.responsavel));
      if(x.atualizadoEm)m.push('Revisado em '+fmtDate(x.atualizadoEm));
      return '<div class="doc"><div class="ico">'+I.doc+'</div><div><p class="t">'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(x.titulo)+'</a>':esc(x.titulo))+'</p>'+(x.descricao?'<p class="d">'+esc(x.descricao)+'</p>':'')+(m.length?'<div class="meta">'+m.join('<span aria-hidden="true">·</span>')+'</div>':'')+'</div><div class="row-actions">'+(u?'<a class="icon-btn open" href="'+esc(u)+'" target="_blank" rel="noopener">Abrir '+I.ext+'</a>':'')+editBtn("docs",x.id)+'</div></div>';
    }).join("")+'</div></div>';
  }).join("");
}
function chanHref(x){var a=x.endereco||"";switch(x.tipo){case "E-mail":return a?"mailto:"+a.trim():"";case "Telefone":return telHref(a);case "WhatsApp":return waHref(a);default:return safeUrl(a);}}
function rCanais(items){
  items=items.slice().sort(function(a,b){return (b.urgente?1:0)-(a.urgente?1:0)||String(a.nome).localeCompare(String(b.nome),"pt-BR");});
  return '<div class="chan-grid">'+items.map(function(x){
    var file=isFile(x);
    if(file)return '<article class="chan t-file"><div class="chan-head"><div class="ico">'+I.Arquivo+'</div><div><h4>'+esc(x.nome)+'</h4><div class="kind"><span class="ctype">📎 Arquivo</span>'+(x.filial&&norm(x.filial)!=="todas"?' · '+esc(x.filial):'')+'</div></div></div>'+
      (x.quandoUsar?'<p class="when">'+esc(x.quandoUsar)+'</p>':'')+
      '<div class="addr file"><span>'+esc(x.arquivoNome||"arquivo")+'</span><small>'+fmtSize(x.arquivoTamanho)+'</small></div>'+
      '<div class="foot"><span class="kind">'+(x.arquivoEm?'Enviado em '+fmtDate(String(x.arquivoEm).slice(0,10)):'')+'</span><div class="row-actions"><a class="icon-btn open" href="'+esc(fileUrl(x))+'" target="_blank" rel="noopener">Abrir arquivo</a>'+editBtn("canais",x.id)+'</div></div></article>';
    var href=chanHref(x),lbl=x.tipo==="E-mail"?"Enviar e-mail":x.tipo==="Telefone"?"Ligar":x.tipo==="WhatsApp"?"Abrir WhatsApp":"Abrir link";
    var isLink=!x.tipo||x.tipo==="Portal / Link";
    return '<article class="chan'+(x.urgente?' t-urgente':'')+'"><div class="chan-head"><div class="ico">'+(I[x.tipo]||I["Portal / Link"])+'</div><div><h4>'+esc(x.nome)+'</h4><div class="kind">'+(isLink?'<span class="ctype">🔗 Link</span>':esc(x.tipo||""))+(x.urgente?' · para urgências':'')+(x.filial&&norm(x.filial)!=="todas"?' · '+esc(x.filial):'')+'</div></div></div>'+
    (x.quandoUsar?'<p class="when">'+esc(x.quandoUsar)+'</p>':'')+
    (x.endereco?'<div class="addr"><span>'+esc(x.endereco)+'</span><button class="icon-btn" data-copy="'+esc(x.endereco)+'" aria-label="Copiar">'+I.copy+'</button></div>':'')+
    '<div class="foot"><span class="kind">'+(x.horario?'Atende: '+esc(x.horario):'')+'</span><div class="row-actions">'+(href?'<a class="icon-btn open" href="'+esc(href)+'" target="_blank" rel="noopener">'+lbl+'</a>':'')+editBtn("canais",x.id)+'</div></div></article>';
  }).join("")+'</div>';
}
function rContatos(items){
  items=items.slice().sort(function(a,b){return String(a.filial||"").localeCompare(String(b.filial||""),"pt-BR")||String(a.nome).localeCompare(String(b.nome),"pt-BR");});
  return '<div class="ct-wrap"><div class="ct head"><span></span><span>Nome e cargo</span><span>Filial / área</span><span>Contato</span><span></span></div>'+items.map(function(x){
    var t=telHref(x.telefone),w=waHref(x.telefone);
    return '<div class="ct"><div class="avatar" aria-hidden="true">'+esc(initials(x.nome))+'</div><div><div class="nm">'+esc(x.nome)+'</div><div class="rl">'+esc(x.cargo||"")+'</div></div><div class="fl">'+esc(x.filial||"Corporativo")+(x.area?'<small>'+esc(x.area)+'</small>':'')+'</div><div class="cx">'+(x.telefone?'<a href="'+esc(t)+'">'+esc(x.telefone)+'</a>':'')+(x.email?'<a href="mailto:'+esc(x.email)+'">'+esc(x.email)+'</a>':'')+'</div><div class="row-actions">'+(x.whatsapp&&w?'<a class="icon-btn" href="'+esc(w)+'" target="_blank" rel="noopener" aria-label="WhatsApp">'+I.WhatsApp+'</a>':'')+(x.email?'<a class="icon-btn" href="https://teams.microsoft.com/l/chat/0/0?users='+encodeURIComponent(x.email)+'" target="_blank" rel="noopener" aria-label="Conversar no Teams">'+I.Teams+'</a>':'')+editBtn("contatos",x.id)+'</div></div>';
  }).join("")+'</div>';
}

/* ---------- modal ---------- */
var FORMS={
 docs:[{k:"titulo",l:"Título",req:1,ph:"Ex.: POP de recebimento de mercadorias"},{k:"categoria",l:"Categoria",type:"list",opts:CATS,req:1},{k:"url",l:"Link do documento",ph:"SharePoint, Drive, SoftExpert…",req:1},{k:"descricao",l:"Para que serve",type:"area"},["filial","responsavel"],{k:"atualizadoEm",l:"Última revisão",type:"date"}],
 canais:[{k:"nome",l:"Nome do canal / área",req:1,ph:"Ex.: Central de Transportes"},{k:"tipo",l:"Tipo",type:"select",opts:TIPOS,req:1},{k:"endereco",l:"E-mail, número ou link",req:1},{k:"quandoUsar",l:"Quando usar",type:"area",ph:"Que tipo de demanda vai por aqui"},["horario","filial"],{k:"urgente",l:"Canal para urgências",type:"check"}],
 contatos:[{k:"nome",l:"Nome",req:1},["cargo","area"],{k:"filial",l:"Filial",ph:"Deixe vazio para corporativo"},["telefone","email"],{k:"whatsapp",l:"Telefone também atende WhatsApp",type:"check"}]
};
var LBL={filial:"Filial (vazio = todas)",responsavel:"Responsável",horario:"Horário de atendimento",cargo:"Cargo",area:"Área",telefone:"Telefone",email:"E-mail"};
var PH={horario:"Ex.: seg–sex, 8h às 18h",telefone:"(34) 0000-0000",email:"nome@martins.com.br"};
var editing=null;
function fieldHtml(f,v){
  if(typeof f==="string")f={k:f,l:LBL[f],ph:PH[f],type:f==="email"?"email":f==="telefone"?"tel":"text"};
  var id="f_"+f.k,val=v[f.k]==null?"":v[f.k],lab='<label for="'+id+'">'+esc(f.l)+(f.req?' *':'')+'</label>';
  if(f.type==="check")return '<div class="field"><label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="'+id+'" style="width:auto"'+(val?' checked':'')+'> '+esc(f.l)+'</label></div>';
  if(f.type==="area")return '<div class="field">'+lab+'<textarea id="'+id+'" placeholder="'+esc(f.ph||"")+'">'+esc(val)+'</textarea></div>';
  if(f.type==="select")return '<div class="field">'+lab+'<select id="'+id+'">'+f.opts.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>';}).join("")+'</select></div>';
  var extra="";
  if(f.type==="list"){extra=' list="dl_'+f.k+'"';}
  if(f.k==="filial"){extra=' list="dl_filial"';}
  if(f.k==="area"){extra=' list="dl_area"';}
  return '<div class="field">'+lab+'<input id="'+id+'" type="'+(f.type==="date"?"date":f.type||"text")+'"'+extra+' value="'+esc(val)+'" placeholder="'+esc(f.ph||"")+'"></div>';
}
function openModal(col,id){
  var v=id?(state[col].find(function(x){return x.id===id;})||{}):{};
  if(!id&&col!=="contatos"&&ui.filial)v={filial:ui.filial};
  if(!id&&col==="contatos"&&ui.filial)v={filial:ui.filial};
  if(!id&&col==="docs"&&ui.chip.docs)v.categoria=ui.chip.docs;
  if(!id&&col==="canais"&&ui.chip.canais)v.tipo=ui.chip.canais;
  editing={col:col,id:id||null};
  $("mTitle").textContent=(id?"Editar ":"Novo ")+(col==="docs"?"documento":col==="canais"?"link útil":col==="comunicacoes"?"comunicação":"contato");
  var areas={};state.contatos.forEach(function(x){if(x.area)areas[x.area]=1;});
  var h=col==="comunicacoes"?comForm(v):col==="canais"?canalForm(v,!!id):FORMS[col].map(function(f){return Array.isArray(f)?'<div class="two">'+f.map(function(k){return fieldHtml(k,v);}).join("")+'</div>':fieldHtml(f,v);}).join("");
  h+='<datalist id="dl_categoria">'+CATS.map(function(o){return '<option value="'+esc(o)+'">';}).join("")+'</datalist>';
  h+='<datalist id="dl_filial">'+filiais().map(function(o){return '<option value="'+esc(o)+'">';}).join("")+'</datalist>';
  h+='<datalist id="dl_area">'+Object.keys(areas).map(function(o){return '<option value="'+esc(o)+'">';}).join("")+'</datalist>';
  $("mForm").innerHTML=h;$("mErr").textContent="";$("mErr").className="err";$("mSave").disabled=false;
  if(col==="canais")wireCanalForm();
  else if(col==="comunicacoes"){var upd=function(){var f=$("f_imagem").files[0];$("mSave").textContent=f||!v.arquivoChave?"Enviar e publicar":"Salvar";};$("f_imagem").onchange=upd;upd();}
  else $("mSave").textContent="Salvar";
  var d=$("mDel");d.hidden=!id;d.classList.remove("confirm");d.textContent="Excluir";
  $("backdrop").hidden=false;setTimeout(function(){var first=$("mForm").querySelector("input,select,textarea");if(first)first.focus();},30);
}
/* formulário de Links úteis: Link ou Arquivo */
function canalForm(v,editingExisting){
  var tipoC=isFile(v)?"arquivo":"link";
  var h='<div class="field"><label>Tipo de conteúdo</label><div class="seg" role="radiogroup">'+
    '<label><input type="radio" name="conteudo" value="link"'+(tipoC==="link"?' checked':'')+(editingExisting&&tipoC==="arquivo"?'':'')+'><span>🔗 Link</span></label>'+
    '<label><input type="radio" name="conteudo" value="arquivo"'+(tipoC==="arquivo"?' checked':'')+'><span>📎 Arquivo</span></label></div></div>';
  h+='<div class="field"><label for="f_nome">Nome *</label><input id="f_nome" type="text" value="'+esc(v.nome||"")+'" placeholder="Ex.: Portal de RH"></div>';
  h+='<div class="field" id="boxLink"><label for="f_endereco">URL *</label><input id="f_endereco" type="text" value="'+esc(isFile(v)?"":(v.endereco||""))+'" placeholder="https://…"></div>';
  h+='<div class="field" id="boxFile">'+
    (isFile(v)?'<label>Arquivo atual</label><div class="file-cur"><span>📎 '+esc(v.arquivoNome||"arquivo")+'</span><small>'+fmtSize(v.arquivoTamanho)+'</small></div><label for="f_arquivo" style="margin-top:6px">Substituir arquivo (opcional)</label>':'<label for="f_arquivo">Arquivo *</label>')+
    '<input id="f_arquivo" type="file"><small class="hint">Até 95 MB. PDFs e imagens abrem no navegador; os demais são baixados.</small></div>';
  h+='<div class="field"><label for="f_quandoUsar">Descrição (opcional)</label><textarea id="f_quandoUsar" placeholder="Para que serve">'+esc(v.quandoUsar||"")+'</textarea></div>';
  h+='<div class="field"><label for="f_filial">Filial (vazio = todas)</label><input id="f_filial" type="text" list="dl_filial" value="'+esc(v.filial||"")+'"></div>';
  return h;
}
function canalMode(){var r=document.querySelector('input[name="conteudo"]:checked');return r?r.value:"link";}
function wireCanalForm(){
  function upd(){
    var m=canalMode(),cur=editing&&editing.id?state.canais.find(function(x){return x.id===editing.id;}):null;
    $("boxLink").hidden=m!=="link";$("boxFile").hidden=m!=="arquivo";
    var f=$("f_arquivo").files[0];
    $("mSave").textContent=m==="arquivo"&&(f||!isFile(cur))?"Enviar e salvar":"Salvar";
  }
  document.querySelectorAll('input[name="conteudo"]').forEach(function(r){r.onchange=upd;});
  $("f_arquivo").onchange=function(){var f=this.files[0];if(f&&!$("f_nome").value.trim())$("f_nome").value=f.name.replace(/\.[^.]+$/,"");upd();};
  upd();
}
function msg(t,isErr){$("mErr").textContent=t;$("mErr").className=isErr?"err":"err info";}
function uploadFile(id,file,fields,col){
  var fd=new FormData();fd.append("file",file,file.name);fd.append("id",id);fd.append("col",col||"canais");
  Object.keys(fields).forEach(function(k){fd.append(k,fields[k]==null?"":String(fields[k]));});
  return fetch(API_BASE+"/api/files/upload",{method:"POST",body:fd}).then(function(r){if(!r.ok)return apiErr(r);return r.json();});
}
function saveCanal(){
  var cur=editing.id?state.canais.find(function(x){return x.id===editing.id;}):null;
  var m=canalMode(),nome=$("f_nome").value.trim(),desc=$("f_quandoUsar").value.trim(),filial=$("f_filial").value.trim();
  if(!nome){msg("Preencha o nome.",true);return;}
  var base=cur?Object.assign({},cur):{};delete base.id;
  if(m==="link"){
    var url=$("f_endereco").value.trim();
    if(!url){msg("Preencha a URL.",true);return;}
    var keepTipo=cur&&!isFile(cur)&&cur.tipo&&cur.tipo!=="Arquivo"?cur.tipo:"Portal / Link";
    if(keepTipo==="Portal / Link"&&!safeUrl(url)){msg("A URL precisa começar com http:// ou https://.",true);return;}
    ["arquivoNome","arquivoChave","arquivoTamanho","arquivoMime","arquivoEm"].forEach(function(k){delete base[k];});
    var d=Object.assign(base,{nome:nome,endereco:url,quandoUsar:desc,filial:filial,tipo:keepTipo,conteudo:"link"});
    upsert("canais",editing.id,d).then(function(){closeModal();toast(cur&&isFile(cur)?"Pronto. Ao Salvar, o arquivo antigo será removido.":"Pronto. Clique em Salvar para gravar.");});
    return;
  }
  var file=$("f_arquivo").files[0];
  if(!file&&!isFile(cur)){msg("Escolha um arquivo.",true);return;}
  if(file&&file.size>MAX_UPLOAD){msg("O arquivo passa de 95 MB.",true);return;}
  if(!file){ // só alterou nome/descrição de um arquivo existente
    upsert("canais",editing.id,Object.assign(base,{nome:nome,quandoUsar:desc,filial:filial,tipo:"Arquivo",conteudo:"arquivo"})).then(function(){closeModal();toast("Pronto. Clique em Salvar para gravar.");});
    return;
  }
  var id=editing.id||newId(),b=$("mSave");
  b.disabled=true;$("mCancel").disabled=true;msg("Enviando arquivo…",false);
  uploadFile(id,file,{nome:nome,quandoUsar:desc,filial:filial}).then(function(res){
    var item=res.item;
    state.canais=state.canais.filter(function(x){return x.id!==item.id;}).concat([item]);
    delete pending["canais|"+item.id];
    if(res.savedAt){lastSync=res.savedAt;}
    online=true;cacheSave();closeModal();setStatus();render();toast("Arquivo salvo com sucesso.");
  }).catch(function(e){console.error("portal-filiais: upload",e);
    msg(e&&e.code==="files_missing"?"O armazenamento de arquivos (R2) ainda não está configurado no Worker.":e&&e.code==="too_large"?"O arquivo passa do limite permitido.":"Não foi possível enviar o arquivo. Tente de novo.",true);
  }).then(function(){b.disabled=false;$("mCancel").disabled=false;});
}
function closeModal(){$("backdrop").hidden=true;editing=null;}
function collect(){
  var out={},miss=[];
  FORMS[editing.col].forEach(function(f){(Array.isArray(f)?f:[f]).forEach(function(g){var k=typeof g==="string"?g:g.k,el=$("f_"+k);if(!el)return;
    var val=el.type==="checkbox"?el.checked:el.value.trim();out[k]=val;if(g.req&&!val)miss.push(g.l);});});
  if(miss.length){$("mErr").textContent="Preencha: "+miss.join(", ")+".";return null;}
  if(editing.col==="docs"&&!safeUrl(out.url)){$("mErr").textContent="O link precisa começar com http:// ou https://.";return null;}
  if(out.email&&!/^\S+@\S+\.\S+$/.test(out.email)){$("mErr").textContent="Confira o e-mail.";return null;}
  return out;
}
$("mSave").onclick=function(){if(!editing)return;if(editing.col==="canais"){saveCanal();return;}if(editing.col==="comunicacoes"){saveComunicacao();return;}var d=collect();if(!d)return;var e=editing,b=this;b.disabled=true;
  upsert(e.col,e.id,d).then(function(){closeModal();toast("Pronto. Clique em Salvar para gravar.");}).catch(function(err){$("mErr").textContent=err&&err.code==="not_granted"?"Você não tem permissão para editar este portal.":"Não foi possível salvar agora. Tente de novo.";}).then(function(){b.disabled=false;});};
$("mDel").onclick=function(){var b=this;if(!b.classList.contains("confirm")){b.classList.add("confirm");b.textContent="Confirmar exclusão";return;}
  var e=editing;remove(e.col,e.id).then(function(){closeModal();toast("Item removido. Clique em Salvar para gravar.");}).catch(function(){$("mErr").textContent="Não foi possível excluir agora.";});};
$("mCancel").onclick=function(){if(!this.disabled)closeModal();};
$("backdrop").addEventListener("click",function(ev){if(ev.target===this)closeModal();});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&!$("backdrop").hidden)closeModal();});

/* ---------- events ---------- */
document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){ui.tab=t.dataset.tab;render();};});
$("q").addEventListener("input",function(){ui.q=this.value;render();});
$("filial").addEventListener("change",function(){ui.filial=this.value;render();});
$("btnAdd").onclick=function(){openModal(ui.tab);};
$("btnSync").onclick=function(){doSync(false);};
$("btnSave").onclick=doSave;
$("main").addEventListener("click",function(ev){
  var b=ev.target.closest("[data-edit],[data-chip],[data-copy],[data-add],[data-go],[data-slide]");if(!b)return;
  if(b.dataset.slide){var v=b.dataset.slide;goSlide(v==="prev"?ui.slide-1:v==="next"?ui.slide+1:Number(v));return;}
  if(b.dataset.go){ui.tab=b.dataset.go;render();window.scrollTo(0,0);return;}
  if(b.dataset.add){openModal(ui.tab);return;}
  if(b.hasAttribute("data-chip")){ui.chip[ui.tab]=b.dataset.chip;render();return;}
  if(b.dataset.copy){var s=b.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(function(){toast("Copiado.");}).catch(function(){toast("Selecione e copie: "+s);});return;}
  if(b.dataset.edit){var p=b.dataset.edit.split("|");openModal(p[0],p.slice(1).join("|"));}
});

/* ---------- boot ---------- */
cacheLoad();setStatus();render();
doSync(true);
})();
</script></body></html>
